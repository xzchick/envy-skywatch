name: Release

# Build the standalone bundles on each OS and attach them to a GitHub Release
# when a v* tag is pushed. PyInstaller does not cross-compile, so each OS builds
# its own bundle; a final job collects them, writes SHA256SUMS.txt and publishes.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and build the release bundle
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller build
          python scripts/build_release_bundle.py
      - name: Smoke test the standalone bundle
        run: python scripts/smoke_test_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.whl
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # OIDC token for Sigstore keyless signing
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate SBOM (CycloneDX)
        run: |
          python -m pip install --upgrade pip cyclonedx-bom
          python -m venv sbomenv
          ./sbomenv/bin/pip install dist/*.whl
          cyclonedx-py environment sbomenv --of JSON -o dist/sbom.cdx.json
          echo "SBOM components: $(grep -c '\"bom-ref\"' dist/sbom.cdx.json || true)"
      - name: Write combined checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          echo "Release assets:"
          cat SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@v3.7.0
      - name: Sign the checksums (Sigstore keyless)
        run: |
          cosign sign-blob --yes \
            --bundle dist/SHA256SUMS.txt.sigstore.json \
            dist/SHA256SUMS.txt
          echo "Signed SHA256SUMS.txt -> SHA256SUMS.txt.sigstore.json"
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true


  # Publish the wheel and sdist to PyPI via trusted publishing (OIDC, no token).
  # Runs only after the cross-platform build and smoke test above have passed.
  pypi:
    needs: build
    # Skipped (not failed) until the PyPI trusted publisher is registered. To turn it on:
    #   gh variable set PYPI_PUBLISH --body true
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
